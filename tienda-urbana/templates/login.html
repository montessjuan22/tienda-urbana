<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Tienda Urbana</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <!-- Marca / Logo -->
    <div class="mb-8 text-center">
        <span
            class="inline-block px-3 py-1 rounded-full bg-red-950 border border-red-800 text-red-400 text-xs font-semibold tracking-wider uppercase mb-2">Plataforma
            Segura</span>
        <h1 class="text-3xl font-black tracking-wider text-white">TIENDA <span class="text-red-600">URBANA</span></h1>
    </div>

    <div
        class="max-w-md w-full bg-gray-900 border border-gray-800/80 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-red-600 via-rose-500 to-red-700"></div>

        <h2 class="text-xl font-bold tracking-tight text-white mb-6">Iniciar sesión</h2>

        {% with mensajes = get_flashed_messages() %}
        {% if mensajes %}
        <div class="mb-6 p-4 rounded-xl bg-red-950/60 border border-red-800/60 text-red-300 text-sm space-y-1">
            {% for mensaje in mensajes %}
            <p class="flex items-center gap-2">⚠️ {{ mensaje }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Usuario</label>
                <input name="usuario" required placeholder="Ingresa tu usuario"
                    class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition">
            </div>
            <div>
                <label
                    class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Contraseña</label>
                <input type="password" name="clave" required placeholder="••••••••"
                    class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition">
            </div>
            <button type="submit"
                class="w-full py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-lg shadow-red-900/20 transition duration-200 cursor-pointer">Ingresar
                al sistema</button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-800 text-center text-sm text-gray-400">
            ¿No tienes cuenta? <a href="{{ url_for('registro') }}"
                class="text-red-500 hover:text-red-400 font-semibold transition">Regístrate aquí</a>
        </div>
    </div>
</body>

</html>
