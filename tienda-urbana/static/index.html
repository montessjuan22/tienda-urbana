<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BARRIO — ropa y zapatos urbanos</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Archivo', 'system-ui', 'sans-serif'] },
          colors: { ink: '#15171C', wall: '#F3F4F6', paint: '#2F45FF' }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: Archivo, system-ui, sans-serif
    }

    .display {
      font-stretch: 125%;
      font-weight: 900;
      letter-spacing: -.02em;
      line-height: .9
    }

    *:focus-visible {
      outline: 3px solid #2F45FF;
      outline-offset: 2px
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

<body class="bg-wall text-ink min-h-screen selection:bg-paint selection:text-white">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const money = n => '$' + Number(n).toLocaleString('es-CO');
    async function api(path, method = 'GET', body) {
      const r = await fetch('/api/' + path, {
        method, headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'Algo salió mal.');
      return data;
    }

    // Imágenes urbanas por defecto si el producto no tiene una propia o para inicializar mejor
    const fallbackImages = {
      'Ropa': 'https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=600&q=80',
      'Zapatos': 'https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=600&q=80',
      'Accesorios': 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80'
    };

    function Pic({ p, className = '' }) {
      const imgSrc = p.image && p.image.startsWith('http') ? p.image : (fallbackImages[p.category] || fallbackImages['Ropa']);
      return <div className={'w-full h-full overflow-hidden bg-gray-200 relative group ' + className}>
        <img src={imgSrc} alt={p.name} className="object-cover w-full h-full group-hover:scale-105 transition-transform duration-500" />
      </div>;
    }

    const Btn = ({ kind = 'solid', className = '', ...p }) =>
      <button {...p} className={'px-4 py-3 font-bold text-sm transition-all duration-200 active:scale-95 disabled:opacity-40 disabled:pointer-events-none ' +
        (kind === 'solid' ? 'bg-ink text-wall hover:bg-paint hover:text-white shadow-sm ' : kind === 'accent' ? 'bg-paint text-white hover:bg-blue-700 shadow-md '
          : 'border-2 border-ink hover:bg-ink hover:text-wall ') + className} />;

    const Field = ({ label, ...p }) =>
      <label className="block text-sm font-bold tracking-wide">{label}
        <input {...p} className="mt-1.5 w-full border-2 border-ink bg-white px-3.5 py-2.5 font-normal focus:bg-blue-50/30 transition-colors" /></label>;

    function App() {
      const [user, setUser] = useState(null);
      const [products, setProducts] = useState([]);
      const [cart, setCart] = useState([]);
      const [view, setView] = useState('shop');
      const [cartOpen, setCartOpen] = useState(false);
      const [toast, setToast] = useState('');
      const say = m => { setToast(m); setTimeout(() => setToast(''), 2800); };
      const load = () => api('products').then(setProducts);
      useEffect(() => { api('me').then(d => setUser(d.user)); load(); }, []);

      const add = p => {
        setCart(c => {
          const f = c.find(i => i.id === p.id);
          if (f) return c.map(i => i.id === p.id ? { ...i, qty: Math.min(i.qty + 1, p.stock) } : i);
          return [...c, { id: p.id, name: p.name, price: p.price, qty: 1, stock: p.stock, category: p.category, image: p.image }];
        });
        say(p.name + ' agregado al carrito');
      };
      const count = cart.reduce((s, i) => s + i.qty, 0);
      const logout = async () => { await api('logout', 'POST'); setUser(null); setView('shop'); say('Sesión cerrada'); };

      return <div className="min-h-screen flex flex-col justify-between">
        <header className="bg-ink text-wall sticky top-0 z-30 shadow-lg">
          <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
            <button onClick={() => setView('shop')} className="display text-3xl tracking-tighter hover:opacity-85 transition-opacity">BARRIO<span className="text-paint">.</span></button>
            <nav className="flex items-center gap-1 sm:gap-3 text-sm font-bold">
              {user?.role === 'admin' && <button onClick={() => setView('admin')} className="px-3 py-2 bg-paint text-white rounded hover:bg-blue-700 transition-colors">Panel admin</button>}
              {user && <button onClick={() => setView('orders')} className="px-3 py-2 hover:text-paint transition-colors">Mis pedidos</button>}
              {user ? <button onClick={logout} className="px-3 py-2 hover:text-paint transition-colors">Salir ({user.name.split(' ')[0]})</button>
                : <button onClick={() => setView('login')} className="px-3 py-2 hover:text-paint transition-colors">Entrar</button>}
              <button onClick={() => setCartOpen(true)} className="px-4 py-2 border-2 border-wall rounded-full hover:bg-wall hover:text-ink transition-all flex items-center gap-2">
                <span>Carrito</span>
                <span className="bg-paint text-white text-xs px-2 py-0.5 rounded-full">{count}</span>
              </button>
            </nav>
          </div>
        </header>

        <div className="flex-1">
          {view === 'shop' && <Shop products={products} add={add} />}
          {view === 'login' && <Auth onDone={u => { setUser(u); setView('shop'); say('¡Bienvenido, ' + u.name + '!'); }} />}
          {view === 'checkout' && <Checkout cart={cart} user={user} onPaid={() => { setCart([]); load(); setView('orders'); say('Pago aprobado. ¡Gracias por tu compra!'); }} />}
          {view === 'orders' && <Orders />}
          {view === 'admin' && user?.role === 'admin' && <Admin products={products} reload={load} say={say} me={user} />}
        </div>

        <footer className="bg-ink text-wall/60 py-8 border-t border-white/10 mt-12">
          <div className="max-w-6xl mx-auto px-4 text-center text-sm">
            <p className="display text-xl text-wall mb-2">BARRIO URBANO</p>
            <p>Ropa y zapatos para la calle. Envíos seguros a todo el país.</p>
          </div>
        </footer>

        {cartOpen && <Cart cart={cart} setCart={setCart} close={() => setCartOpen(false)}
          go={() => { setCartOpen(false); setView(user ? 'checkout' : 'login'); if (!user) say('Entra o crea tu cuenta para pagar.'); }} />}
        {toast && <div role="status" className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-wall border-2 border-paint px-6 py-3 font-bold z-50 shadow-2xl animate-bounce">{toast}</div>}
      </div>;
    }

    function Shop({ products, add }) {
      const [cat, setCat] = useState('Todo');
      const cats = ['Todo', ...new Set(products.map(p => p.category))];
      const list = cat === 'Todo' ? products : products.filter(p => p.category === cat);
      return <main className="max-w-6xl mx-auto px-4 py-12">
        <div className="bg-ink text-wall p-8 sm:p-12 mb-10 relative overflow-hidden shadow-xl">
          <div className="relative z-10 max-w-xl">
            <span className="bg-paint text-white text-xs font-black px-3 py-1 uppercase tracking-widest mb-4 inline-block">Nueva Colección</span>
            <h1 className="display text-4xl sm:text-6xl mb-4 text-white">Ropa y zapatos<br />para la calle.</h1>
            <p className="text-wall/80 text-base sm:text-lg">Cortes anchos, suelas gruesas y diseños listos para el asfalto.</p>
          </div>
        </div>

        <div className="flex gap-2 flex-wrap mb-8">
          {cats.map(c => <button key={c} onClick={() => setCat(c)}
            className={'px-5 py-2.5 border-2 border-ink font-extrabold text-sm transition-all ' + (c === cat ? 'bg-ink text-wall shadow-md' : 'bg-white hover:bg-ink hover:text-wall')}>{c}</button>)}
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
          {list.map(p => <article key={p.id} className="bg-white border-2 border-ink flex flex-col shadow-sm hover:shadow-xl transition-shadow duration-300">
            <div className="aspect-[4/5]"><Pic p={p} /></div>
            <div className="p-4 flex flex-col gap-2 flex-1 justify-between">
              <div>
                <span className="text-xs font-bold text-paint uppercase tracking-wider">{p.category}</span>
                <h2 className="font-extrabold text-lg leading-snug mt-0.5">{p.name}</h2>
                <p className="text-xs text-ink/70 mt-1 line-clamp-2">{p.description}</p>
              </div>
              <div className="pt-2 border-t border-gray-100 flex items-center justify-between mt-2">
                <span className="font-black text-lg">{money(p.price)}</span>
                <span className={'text-xs font-bold px-2 py-1 ' + (p.stock > 0 ? 'text-green-700 bg-green-50' : 'text-red-700 bg-red-50')}>
                  {p.stock > 0 ? `${p.stock} disp.` : 'Agotado'}
                </span>
              </div>
              <Btn disabled={p.stock < 1} onClick={() => add(p)} className="w-full mt-1">
                {p.stock < 1 ? 'Agotado' : 'Agregar'}
              </Btn>
            </div>
          </article>)}
        </div>
      </main>;
    }

    function Cart({ cart, setCart, close, go }) {
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const upd = (id, d) => setCart(c => c.map(i => i.id === id ? { ...i, qty: Math.max(1, Math.min(i.stock, i.qty + d)) } : i));
      return <div className="fixed inset-0 z-40 flex justify-end bg-ink/70 backdrop-blur-sm transition-opacity" onClick={close}>
        <aside className="bg-wall w-full max-w-md h-full p-6 flex flex-col shadow-2xl overflow-y-auto" onClick={e => e.stopPropagation()}>
          <div className="flex justify-between items-center mb-6 pb-4 border-b-2 border-ink">
            <h2 className="display text-3xl">Tu Carrito</h2>
            <button onClick={close} className="font-bold px-3 py-1 border-2 border-ink hover:bg-ink hover:text-wall transition-colors">Cerrar</button>
          </div>
          <div className="flex-1 space-y-4">
            {!cart.length && <div className="text-center py-12"><p className="text-lg font-medium text-ink/60">Aún no agregas nada.</p><p className="text-sm text-ink/40 mt-1">Elige algo de la tienda para empezar.</p></div>}
            {cart.map(i => <div key={i.id} className="bg-white border-2 border-ink p-4 flex gap-4 items-center shadow-sm">
              <div className="w-16 h-16 shrink-0"><Pic p={i} className="rounded-none" /></div>
              <div className="flex-1 min-w-0">
                <p className="font-bold truncate">{i.name}</p>
                <p className="text-sm font-black text-paint mt-0.5">{money(i.price)}</p>
                <div className="flex items-center gap-2 mt-2">
                  <button onClick={() => upd(i.id, -1)} className="border-2 border-ink w-7 h-7 font-bold flex items-center justify-center hover:bg-ink hover:text-white transition-colors" aria-label="Quitar uno">−</button>
                  <span className="w-6 text-center font-bold">{i.qty}</span>
                  <button onClick={() => upd(i.id, 1)} className="border-2 border-ink w-7 h-7 font-bold flex items-center justify-center hover:bg-ink hover:text-white transition-colors" aria-label="Agregar uno">+</button>
                  <button onClick={() => setCart(c => c.filter(x => x.id !== i.id))} className="ml-auto text-xs font-bold text-red-600 hover:underline">Quitar</button>
                </div>
              </div>
            </div>)}
          </div>
          {cart.length > 0 && <div className="pt-4 border-t-2 border-ink mt-4">
            <div className="flex justify-between font-black text-2xl mb-6"><span>Total</span><span>{money(total)}</span></div>
            <Btn kind="accent" className="w-full py-4 text-base" onClick={go}>Ir a pagar</Btn>
          </div>}
        </aside></div>;
    }

    function Auth({ onDone }) {
      const [mode, setMode] = useState('login');
      const [f, setF] = useState({ name: '', email: '', password: '' });
      const [error, setError] = useState('');
      const set = k => e => setF({ ...f, [k]: e.target.value });
      const submit = async e => {
        e.preventDefault(); setError('');
        try { onDone((await api(mode, 'POST', f)).user); } catch (x) { setError(x.message); }
      };
      return <main className="max-w-md mx-auto px-4 py-16">
        <div className="bg-white border-2 border-ink p-8 shadow-xl">
          <h1 className="display text-4xl mb-2">{mode === 'login' ? 'Iniciar Sesión' : 'Crear Cuenta'}</h1>
          <p className="text-sm text-ink/70 mb-6">{mode === 'login' ? 'Accede a tus pedidos y perfil.' : 'Únete a la comunidad de BARRIO.'}</p>
          <form onSubmit={submit} className="space-y-4">
            {mode === 'register' && <Field label="Nombre completo" value={f.name} onChange={set('name')} required />}
            <Field label="Correo electrónico" type="email" value={f.email} onChange={set('email')} required />
            <Field label="Contraseña" type="password" value={f.password} onChange={set('password')} required />
            {error && <p role="alert" className="text-red-700 font-semibold text-sm bg-red-50 p-3 border border-red-200">{error}</p>}
            <Btn kind="accent" className="w-full mt-2">{mode === 'login' ? 'Entrar' : 'Crear mi cuenta'}</Btn>
          </form>
          <button onClick={() => setMode(mode === 'login' ? 'register' : 'login')} className="mt-6 font-bold text-sm underline hover:text-paint transition-colors block text-center w-full">
            {mode === 'login' ? '¿No tienes cuenta? Regístrate aquí' : '¿Ya tienes cuenta? Entra'}
          </button>
        </div>
      </main>;
    }

    function Checkout({ cart, onPaid }) {
      const [f, setF] = useState({ address: '', card: '', exp: '', cvc: '' });
      const [error, setError] = useState(''); const [busy, setBusy] = useState(false);
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      const set = k => e => setF({ ...f, [k]: e.target.value });
      const pay = async e => {
        e.preventDefault(); setError(''); setBusy(true);
        try {
          await new Promise(r => setTimeout(r, 900));
          await api('checkout', 'POST', { ...f, items: cart.map(i => ({ id: i.id, qty: i.qty })) }); onPaid();
        }
        catch (x) { setError(x.message); } setBusy(false);
      };
      if (!cart.length) return <main className="max-w-md mx-auto p-16 text-center font-bold text-xl">Tu carrito está vacío.</main>;
      return <main className="max-w-xl mx-auto px-4 py-12">
        <div className="bg-white border-2 border-ink p-8 shadow-xl">
          <h1 className="display text-4xl mb-2">Finalizar Pago</h1>
          <p className="mb-6 font-black text-2xl text-paint">{money(total)}</p>
          <div className="bg-blue-50 border-2 border-paint/30 text-ink text-sm p-4 mb-6">
            <p className="font-bold mb-1">Pasarela de prueba segura:</p>
            <p>No se realizarán cargos reales. Usa cualquier tarjeta de 16 dígitos (si termina en 0000 será rechazada).</p>
          </div>
          <form onSubmit={pay} className="space-y-4">
            <Field label="Dirección de envío completa" value={f.address} onChange={set('address')} placeholder="Calle 123 # 45-67, Barrio..." required />
            <Field label="Número de tarjeta" inputMode="numeric" placeholder="4242 4242 4242 4242" value={f.card} onChange={set('card')} required />
            <div className="grid grid-cols-2 gap-4">
              <Field label="Vence (MM/AA)" placeholder="12/28" value={f.exp} onChange={set('exp')} required />
              <Field label="CVC" inputMode="numeric" maxLength={4} placeholder="123" value={f.cvc} onChange={set('cvc')} required /></div>
            {error && <p role="alert" className="text-red-700 font-semibold text-sm bg-red-50 p-3 border border-red-200">{error}</p>}
            <Btn kind="accent" disabled={busy} className="w-full py-4 text-base mt-2">{busy ? 'Procesando pago…' : 'Pagar ' + money(total)}</Btn>
          </form>
        </div>
      </main>;
    }

    function Orders() {
      const [orders, setOrders] = useState(null);
      useEffect(() => { api('orders').then(setOrders); }, []);
      return <main className="max-w-3xl mx-auto px-4 py-12">
        <h1 className="display text-4xl mb-6">Mis Pedidos</h1>
        {!orders && <p className="text-ink/60 font-medium">Cargando pedidos...</p>}
        {orders && !orders.length && <div className="bg-white border-2 border-ink p-8 text-center"><p className="font-bold text-lg">Todavía no has comprado nada.</p></div>}
        <div className="space-y-4">
          {orders?.map(o => <div key={o.id} className="bg-white border-2 border-ink p-6 shadow-sm">
            <div className="flex flex-wrap justify-between items-center gap-2 mb-2 pb-3 border-b border-gray-200">
              <div>
                <span className="font-black text-lg">Pedido #{o.id}</span>
                <span className="ml-3 px-2.5 py-1 text-xs font-bold uppercase bg-gray-100 border border-gray-300">{o.status}</span>
              </div>
              <span className="font-black text-lg text-paint">{money(o.total)}</span>
            </div>
            <p className="text-xs text-ink/60 mb-3">Ref: {o.payment_ref} · Fecha: {o.created_at.replace('T', ' ')}</p>
            <ul className="text-sm space-y-1 bg-wall p-3 border border-gray-200">{o.items.map((i, k) => <li key={k} className="font-medium">{i.qty} × {i.name}</li>)}</ul>
          </div>)}
        </div>
      </main>;
    }

    function Admin({ products, reload, say, me }) {
      const empty = { name: '', category: 'Ropa', price: '', stock: '', image: '', description: '' };
      const [tab, setTab] = useState('products');
      const [f, setF] = useState(empty); const [editing, setEditing] = useState(null);
      const [orders, setOrders] = useState([]); const [users, setUsers] = useState([]);
      const [nu, setNu] = useState({ name: '', email: '', password: '' });
      const loadUsers = () => api('admin/users').then(setUsers);
      useEffect(() => {
        if (tab === 'orders') api('admin/orders').then(setOrders);
        if (tab === 'users') loadUsers();
      }, [tab]);
      const createAdmin = async e => {
        e.preventDefault();
        try {
          const r = await api('admin/users', 'POST', nu);
          say(r.promoted ? 'Usuario existente promovido a administrador' : 'Administrador creado');
          setNu({ name: '', email: '', password: '' }); loadUsers();
        }
        catch (x) { say(x.message); }
      };
      const setRole = async (u, role) => {
        if (!confirm((role === 'admin' ? '¿Hacer administrador a ' : '¿Quitar el rol de administrador a ') + u.name + '?')) return;
        try {
          await api('admin/users/' + u.id + '/role', 'PUT', { role });
          say(role === 'admin' ? 'Ahora es administrador' : 'Rol de administrador retirado'); loadUsers();
        }
        catch (x) { say(x.message); }
      };
      const set = k => e => setF({ ...f, [k]: e.target.value });
      const save = async e => {
        e.preventDefault();
        try {
          editing ? await api('products/' + editing, 'PUT', f) : await api('products', 'POST', f);
          say(editing ? 'Producto actualizado' : 'Producto creado'); setF(empty); setEditing(null); reload();
        }
        catch (x) { say(x.message); }
      };
      const del = async p => {
        if (!confirm('¿Eliminar ' + p.name + '?')) return;
        await api('products/' + p.id, 'DELETE'); say('Producto eliminado'); reload();
      };
      return <main className="max-w-6xl mx-auto px-4 py-12">
        <h1 className="display text-4xl mb-6">Panel de Administración</h1>
        <div className="flex gap-2 mb-8">{[['products', 'Productos'], ['orders', 'Pedidos'], ['users', 'Clientes']].map(([k, l]) =>
          <button key={k} onClick={() => setTab(k)} className={'px-5 py-2.5 border-2 border-ink font-extrabold text-sm transition-all ' + (tab === k ? 'bg-ink text-wall shadow-md' : 'bg-white hover:bg-ink hover:text-wall')}>{l}</button>)}</div>

        {tab === 'products' && <div className="grid lg:grid-cols-3 gap-8">
          <form onSubmit={save} className="bg-white border-2 border-ink p-6 space-y-4 shadow-xl h-fit">
            <h2 className="font-black text-xl pb-2 border-b-2 border-ink">{editing ? 'Editar producto' : 'Nuevo producto'}</h2>
            <Field label="Nombre" value={f.name} onChange={set('name')} required />
            <label className="block text-sm font-bold">Categoría
              <select value={f.category} onChange={set('category')} className="mt-1.5 w-full border-2 border-ink bg-white px-3 py-2.5 font-normal">
                <option>Ropa</option><option>Zapatos</option><option>Accesorios</option></select></label>
            <div className="grid grid-cols-2 gap-4">
              <Field label="Precio (COP)" type="number" min="0" value={f.price} onChange={set('price')} required />
              <Field label="Stock" type="number" min="0" value={f.stock} onChange={set('stock')} required /></div>
            <Field label="URL de la imagen (Opcional)" placeholder="https://..." value={f.image} onChange={set('image')} />
            <Field label="Descripción" value={f.description} onChange={set('description')} />
            <div className="flex gap-3 pt-2">
              <Btn kind="accent" className="flex-1">{editing ? 'Guardar cambios' : 'Crear producto'}</Btn>
              {editing && <Btn type="button" kind="line" onClick={() => { setEditing(null); setF(empty); }}>Cancelar</Btn>}
            </div>
          </form>
          <div className="lg:col-span-2 space-y-3">
            {products.map(p => <div key={p.id} className="bg-white border-2 border-ink p-4 flex items-center gap-4 shadow-sm">
              <div className="w-16 h-16 shrink-0"><Pic p={p} /></div>
              <div className="flex-1 min-w-0">
                <p className="font-extrabold truncate text-base">{p.name}</p>
                <p className="text-sm text-ink/70 mt-0.5">{p.category} · <span className="font-bold text-ink">{money(p.price)}</span> · stock: {p.stock}</p>
              </div>
              <div className="flex gap-3 text-sm font-bold">
                <button className="hover:text-paint underline" onClick={() => { setEditing(p.id); setF({ ...p }); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>Editar</button>
                <button className="text-red-600 hover:underline" onClick={() => del(p)}>Eliminar</button>
              </div>
            </div>)}
          </div>
        </div>}

        {tab === 'orders' && <div className="space-y-3">{!orders.length && <p className="font-medium text-ink/60">No hay pedidos todavía.</p>}
          {orders.map(o => <div key={o.id} className="bg-white border-2 border-ink p-5 shadow-sm">
            <p className="font-black text-base mb-1">Pedido #{o.id} — {o.customer} <span className="text-xs font-normal text-ink/60">({o.email})</span></p>
            <p className="text-sm font-bold text-paint mb-2">{money(o.total)}</p>
            <p className="text-sm text-ink/70"><strong>Envío:</strong> {o.address} · <strong>Ref:</strong> {o.payment_ref}</p>
            <p className="text-xs font-semibold text-ink/80 mt-2 pt-2 border-t border-gray-100">Artículos: {o.items.map(i => i.qty + '× ' + i.name).join(', ')}</p>
          </div>)}</div>}

        {tab === 'users' && <div className="grid lg:grid-cols-3 gap-8">
          <form onSubmit={createAdmin} className="bg-white border-2 border-ink p-6 space-y-4 shadow-xl h-fit">
            <h2 className="font-black text-xl pb-2 border-b-2 border-ink">Nuevo administrador</h2>
            <p className="text-xs text-ink/60">Si el correo ya tiene cuenta, se le da rol de administrador sin cambiar su contraseña.</p>
            <Field label="Nombre" value={nu.name} onChange={e => setNu({ ...nu, name: e.target.value })} />
            <Field label="Correo electrónico" type="email" value={nu.email} onChange={e => setNu({ ...nu, email: e.target.value })} required />
            <Field label="Contraseña (mín. 6)" type="password" value={nu.password} onChange={e => setNu({ ...nu, password: e.target.value })} />
            <Btn kind="accent" className="w-full">Crear administrador</Btn>
          </form>
          <div className="lg:col-span-2 space-y-3">{users.map(u => <div key={u.id} className="bg-white border-2 border-ink p-4 text-sm shadow-sm flex justify-between items-center gap-4">
            <div className="min-w-0">
              <span className="font-black text-base">{u.name}</span>
              <p className="text-xs text-ink/60 mt-0.5 truncate">{u.email}</p>
            </div>
            <div className="text-right shrink-0">
              <span className={'px-2.5 py-1 text-xs font-bold uppercase ' + (u.role === 'admin' ? 'bg-paint text-white' : 'bg-gray-100 text-ink')}>{u.role}</span>
              <p className="text-xs text-ink/50 mt-1">Desde {u.created_at.slice(0, 10)}</p>
              {me && u.id !== me.id && (u.role === 'admin'
                ? <button className="text-red-600 hover:underline text-xs font-bold mt-1" onClick={() => setRole(u, 'customer')}>Quitar admin</button>
                : <button className="hover:text-paint underline text-xs font-bold mt-1" onClick={() => setRole(u, 'admin')}>Hacer admin</button>)}
            </div>
          </div>)}</div>
        </div>}
      </main>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
